name: Deploy Mye3-Elearning

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🏗️ Build Frontend (Vite)
        run: |
          cd frontend
          npm install
          npm run build
        env:
          VITE_API_URL: https://mye3etuitions.com/api

      - name: 🚀 Deploy Frontend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # Protocol FTP matrame unchu (Reset avvakunda untundi)
          protocol: ftp
          local-dir: frontend/dist/
          server-dir: mye3etutions.com/
          # Timeout ni max limits ki penchanu
          timeout: 1000000 
          # Error ekkada ostundo clear ga teliyadaniki verbose mode
          log-level: verbose
          # Ee file sync issue create chesthe exclude cheyi
          exclude: |
            **/.ftp-deploy-sync-state.json

      - name: 🚀 Deploy Backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: backend/
          server-dir: mye3etutions.com/backend/
          timeout: 1000000
          log-level: verbose
          exclude: |
            **/node_modules/**
            **/debug.log
            .git*