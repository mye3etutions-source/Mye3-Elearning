name: Deploy Mye3-Elearning

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🏗️ Build Frontend (Vite)
        run: |
          cd frontend
          npm install
          npm run build
        env:
          # Ikkada kotha domain spelling 'i' tho update chesa
          VITE_API_URL: https://mye3etuitions.com/api

      - name: 🚀 Deploy Frontend to cPanel via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "frontend/dist/*"
          target: "public_html/mye3etuitions.com"
          strip_components: 2

      - name: 🚀 Deploy Backend to cPanel via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "backend/*"
          target: "public_html/mye3etuitions.com"
          strip_components: 1

      - name: 🔄 Restart Backend (Node.js)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          passphrase: ${{ secrets.SSH_PASSPHRASE }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            # Add command to restart node app if needed, e.g., restarting passenger
            touch public_html/mye3etuitions.com/backend/tmp/restart.txt