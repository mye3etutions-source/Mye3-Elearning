name: Deploy Mye3-Elearning

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: 🏗️ Build Frontend (Vite)
        run: |
          cd frontend
          npm install
          npm run build
        env:
          # Kotha domain URL ikkada ivvandi (User browser lo type chese name)
          VITE_API_URL: https://mye3etuitions.com/api

      - name: 🚀 Deploy Frontend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: frontend/dist/
          # Meeru cheppinatlu root folder name marchaledu kabatti ikkada 'i' ledhu
          server-dir: mye3etutions.com/
          timeout: 900000 # 15 minutes ki penchanu
          state-name: .frontend-deploy-state.json

      - name: 🚀 Deploy Backend to cPanel
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          local-dir: backend/
          server-dir: mye3etutions.com/backend/
          timeout: 900000 # 15 minutes
          state-name: .backend-deploy-state.json
          exclude: |
            **/node_modules/**
            **/debug.log
            .git*
            .env